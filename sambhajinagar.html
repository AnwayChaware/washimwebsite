<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurangabad - Gallery</title>
    <style>
        /* General Body Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #7081aa;
        }

        .gallery-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            padding: 20px;
        }

        .image-gallery img, .image-gallery video {
            width: 300px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .image-gallery img:hover, .image-gallery video:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox-content img, .lightbox-content video {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #444;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1>49TH SENIOR WOMEN STATE HANDBALL CHAMPIONSHIP 2023-2024 SAMBHAJINAGAR</h1>
        <div class="image-gallery">
            <img src="tournament/Sambhajinagar/1.jpg" onclick="openLightbox('tournament/Sambhajinagar/1.jpg')">
            <img src="tournament/Sambhajinagar/2.jpg" onclick="openLightbox('tournament/Sambhajinagar/2.jpg')">
            <img src="tournament/Sambhajinagar/3.jpg" onclick="openLightbox('tournament/Sambhajinagar/3.jpg')">
            <img src="tournament/Sambhajinagar/4.jpg" onclick="openLightbox('tournament/Sambhajinagar/4.jpg')">
            <video src="tournament/Sambhajinagar/4.mp4" onclick="openLightbox('tournament/Sambhajinagar/4.mp4')"></video>
            <video src="tournament/Sambhajinagar/5.mp4" onclick="openLightbox('tournament/Sambhajinagar/5.mp4')"></video>
            <video src="tournament/Sambhajinagar/6.mp4" onclick="openLightbox('tournament/Sambhajinagar/6.mp4')"></video>
            <video src="tournament/Sambhajinagar/7.mp4" onclick="openLightbox('tournament/Sambhajinagar/7.mp4')"></video>
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Lightbox Image">
            <video id="lightbox-video" src="" controls></video>
        </div>
    </div>

    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script>
      Shree Sant Gajanan Maharaj Handball Club. All Rights Reserved.</p>
    </footer>

    <script>
        let currentIndex = 0;
        const media = [
            'tournament/Sambhajinagar/1.jpg',
            'tournament/Sambhajinagar/2.jpg',
            'tournament/Sambhajinagar/3.jpg',
            'tournament/Sambhajinagar/4.jpg',
            'tournament/Sambhajinagar/4.mp4',
            'tournament/Sambhajinagar/5.mp4',
            'tournament/Sambhajinagar/6.mp4',
            'tournament/Sambhajinagar/7.mp4',

        ];

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxVideo = document.getElementById('lightbox-video');
            const allVideos = document.querySelectorAll('video');
            
            // Pause all background videos
            allVideos.forEach(video => video.pause());

            if (src.endsWith('.mp4')) {
                lightboxVideo.src = src;
                lightboxVideo.style.display = 'block';
                lightboxImg.style.display = 'none';
                lightboxVideo.play();
            } else {
                lightboxImg.src = src;
                lightboxImg.style.display = 'block';
                lightboxVideo.style.display = 'none';
            }
            lightbox.style.display = 'flex';
            currentIndex = media.indexOf(src);
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-img').src = '';
            document.getElementById('lightbox-video').src = '';
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex > 0) ? currentIndex - 1 : media.length - 1;
                    openLightbox(media[currentIndex]);
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex < media.length - 1) ? currentIndex + 1 : 0;
                    openLightbox(media[currentIndex]);
                }
            }
        });
    </script>
</body>
</html>
