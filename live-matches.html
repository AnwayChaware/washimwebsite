<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Handball Matches</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #0d0d0d; /* Dark background */
            color: #fff;
        }

        /* Floating Live Notification */
        .live-notification {
            background: red;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(255, 0, 0, 0.3);
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 70vh;
            background: url('handball-banner.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5em;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 30px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        /* Navigation Bar */
        nav {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 0;
            position: sticky;
            top: 40px; /* Below live notification */
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            margin: 0 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 1.1em;
            padding: 10px 15px;
            transition: 0.3s ease;
        }

        nav ul li a:hover {
            background: red;
            border-radius: 5px;
        }

        /* Live Match Section */
        .live-container {
            text-align: center;
            padding: 30px 20px;
            background: rgb(70, 70, 155);
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .live-container h2 {
            font-size: 2.5em;
            color: red;
            margin-bottom: 10px;
        }

        .watch-live {
            display: inline-block;
            background: red;
            color: white;
            padding: 15px 25px;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .watch-live:hover {
            background: darkred;
        }

        .live-video {
            width: 100%;
            height: 500px;
            border: 2px solid #444;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
        }

        /* Footer */
        footer {
            background: #000;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .footer-links li {
            margin: 0 15px;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2em;
            }
            .live-container {
                padding: 40px 10px;
            }
            nav ul {
                flex-direction: column;
                text-align: center;
            }
            nav ul li {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Live Notification -->
    <div class="live-notification">
        🚨 Live Match is On! <a href="#live-section" style="color: white; text-decoration: underline;">Watch Now!</a>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Shree Sant Gajanan Maharaja Handball Club</h1>
    </div>

    <!-- Navigation Menu -->
    <nav>
        <ul>
            <li><a href='home.html'>Home</a></li>
            <li><a href='aboutus.html'>About Us</a></li>
            <li><a href='vision.html'>Vision</a></li>
            <li><a href='achivements.html'>Achievements</a></li>
            <li><a href='tournament.html'>Tournaments</a></li>
            <li><a href='news.html'>News</a></li>
            <li><a href='gallery.html'>Gallery</a></li>
            <li><a href='contact.html'>Contact</a></li>
            <li><a href='application.html'>Application</a></li>
        </ul>
    </nav>

    <!-- Live Match Section -->
    <div id="live-section" class="live-container">
        <h2>🔴 Live Handball Match</h2>
        <iframe class="live-video" 
            src="https://www.youtube.com/embed/live_stream?channel=[YOUR_CHANNEL_ID]" 
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
        </iframe>
        <br>
        <a href="https://www.youtube.com/channel/[YOUR_CHANNEL_ID]" class="watch-live" target="_blank">📺 Watch on YouTube</a>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy;<script>document.write(new Date().getFullYear())</script>
      Shree Sant Gajanan Maharaj Handball Club. All Rights Reserved.</p>
    </footer>

</body>
</html>
